name: Validate examples

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository and examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML linter
        run: python -m pip install yamllint==1.35.1
      - name: Lint workflow YAML
        run: yamllint -c .yamllint.yml .github/workflows/validate-examples.yml .yamllint.yml
      - name: Validate repository layout and examples
        run: python scripts/validate_examples.py
